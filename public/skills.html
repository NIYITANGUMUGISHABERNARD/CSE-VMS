<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Skills - CSE-VMS</title>

<link rel="stylesheet" href="css/style.css">

<style>

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7f6;
    }

    .skills-page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 30px;
    }

    .skills-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
    }

    .skills-header h1 {
        margin: 0;
        color: #1f2937;
    }

    .skills-header p {
        margin-top: 8px;
        color: #6b7280;
    }

    .primary-btn {
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        background: #198754;
        color: white;
        cursor: pointer;
        font-weight: 600;
    }

    .primary-btn:hover {
        background: #157347;
    }

    .skills-table-container {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        overflow-x: auto;
    }

    .skills-table {
        width: 100%;
        border-collapse: collapse;
    }

    .skills-table th,
    .skills-table td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid #e5e7eb;
    }

    .skills-table th {
        background: #f8fafc;
        color: #374151;
    }

    .skills-table td {
        color: #4b5563;
    }

    .btn-edit,
    .btn-delete {
        border: none;
        padding: 8px 13px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
    }

    .btn-edit {
        background: #f0ad4e;
        color: white;
    }

    .btn-delete {
        background: #dc3545;
        color: white;
    }

    .btn-edit:hover {
        opacity: 0.85;
    }

    .btn-delete:hover {
        opacity: 0.85;
    }

    .message {
        display: none;
        padding: 12px 15px;
        margin-bottom: 20px;
        border-radius: 8px;
        background: #d1e7dd;
        color: #0f5132;
    }

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }

    .modal-content {
        width: 500px;
        max-width: 90%;
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-sizing: border-box;
    }

    .modal-content h2 {
        margin-top: 0;
        color: #1f2937;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
        color: #374151;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 11px;
        box-sizing: border-box;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        font-size: 14px;
    }

    .form-group textarea {
        min-height: 100px;
        resize: vertical;
    }

    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
    }

    .cancel-btn {
        border: 1px solid #d1d5db;
        background: white;
        padding: 10px 18px;
        border-radius: 7px;
        cursor: pointer;
    }

    .empty {
        text-align: center;
        padding: 30px;
        color: #6b7280;
    }

</style>

</head>

<body>

<div class="skills-page">

    <div class="skills-header">

        <div>

            <h1>Manage Skills</h1>

            <p>
                Add, view, edit and delete community skills.
            </p>

        </div>

        <button
            class="primary-btn"
            onclick="openCreateModal()">

            + Add Skill

        </button>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <div class="skills-table-container">

        <table class="skills-table">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Skill Name</th>

                    <th>Description</th>

                    <th>Created</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="skillsTableBody">

                <tr>

                    <td
                        colspan="5"
                        class="empty">

                        Loading skills...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<div
    id="skillModal"
    class="modal">

    <div class="modal-content">

        <h2 id="modalTitle">
            Add Skill
        </h2>


        <form id="skillForm">

            <input
                type="hidden"
                id="skillId">


            <div class="form-group">

                <label for="skillName">
                    Skill Name
                </label>

                <input
                    type="text"
                    id="skillName"
                    required>

            </div>


            <div class="form-group">

                <label for="skillDescription">
                    Description
                </label>

                <textarea
                    id="skillDescription"
                    required>
                </textarea>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()">

                    Cancel

                </button>


                <button
                    type="submit"
                    class="primary-btn">

                    Save Skill

                </button>

            </div>

        </form>

    </div>

</div>


<script>

    const API_URL = "http://127.0.0.1:3000";

    const token =
        localStorage.getItem("cse_vms_token");


    const tableBody =
        document.getElementById(
            "skillsTableBody"
        );


    const modal =
        document.getElementById(
            "skillModal"
        );


    const skillForm =
        document.getElementById(
            "skillForm"
        );


    if (!token) {

        window.location.href =
            "index.html";

    }


    function showMessage(
        message,
        success = true
    ) {

        const box =
            document.getElementById(
                "message"
            );


        box.textContent = message;

        box.style.display = "block";


        if (success) {

            box.style.background =
                "#d1e7dd";

            box.style.color =
                "#0f5132";

        } else {

            box.style.background =
                "#f8d7da";

            box.style.color =
                "#842029";

        }


        setTimeout(function () {

            box.style.display = "none";

        }, 3000);

    }


    async function loadSkills() {

        try {

            const response =
                await fetch(
                    `${API_URL}/api/admin/skills`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Failed to load skills"
                );

            }


            displaySkills(
                data.skills
            );


        } catch (error) {

            console.error(error);


            tableBody.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="empty">

                        Failed to load skills.

                    </td>
                </tr>
            `;


            showMessage(
                error.message,
                false
            );

        }

    }


    function displaySkills(skills) {

        tableBody.innerHTML = "";


        if (
            !skills ||
            skills.length === 0
        ) {

            tableBody.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="empty">

                        No skills found.

                    </td>
                </tr>
            `;

            return;

        }


        skills.forEach(function (skill) {

            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${skill.id}
                </td>

                <td>
                    <strong>
                        ${escapeHtml(
                            skill.skill_name
                        )}
                    </strong>
                </td>

                <td>
                    ${escapeHtml(
                        skill.description || ""
                    )}
                </td>

                <td>
                    ${formatDate(
                        skill.created_at
                    )}
                </td>

                <td>

                    <button
                        class="btn-edit"
                        onclick="editSkill(${skill.id})">

                        Edit

                    </button>


                    <button
                        class="btn-delete"
                        onclick="deleteSkill(${skill.id})">

                        Delete

                    </button>

                </td>

            `;


            tableBody.appendChild(row);

        });

    }


    async function editSkill(id) {

        try {

            const response =
                await fetch(
                    `${API_URL}/api/admin/skills`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            const data =
                await response.json();


            const skill =
                data.skills.find(
                    item =>
                        Number(item.id) ===
                        Number(id)
                );


            if (!skill) {

                showMessage(
                    "Skill not found.",
                    false
                );

                return;

            }


            document.getElementById(
                "modalTitle"
            ).textContent =
                "Edit Skill";


            document.getElementById(
                "skillId"
            ).value =
                skill.id;


            document.getElementById(
                "skillName"
            ).value =
                skill.skill_name;


            document.getElementById(
                "skillDescription"
            ).value =
                skill.description || "";


            modal.style.display =
                "flex";


        } catch (error) {

            console.error(error);

            showMessage(
                error.message,
                false
            );

        }

    }


    function openCreateModal() {

        document.getElementById(
            "modalTitle"
        ).textContent =
            "Add Skill";


        document.getElementById(
            "skillId"
        ).value = "";


        document.getElementById(
            "skillName"
        ).value = "";


        document.getElementById(
            "skillDescription"
        ).value = "";


        modal.style.display =
            "flex";

    }


    function closeModal() {

        modal.style.display =
            "none";

    }


    skillForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const id =
                document.getElementById(
                    "skillId"
                ).value;


            const skill_name =
                document.getElementById(
                    "skillName"
                ).value.trim();


            const description =
                document.getElementById(
                    "skillDescription"
                ).value.trim();


            const body = {

                skill_name:
                    skill_name,

                description:
                    description

            };


            try {

                let url =
                    `${API_URL}/api/admin/skills`;


                let method =
                    "POST";


                if (id) {

                    url =
                        `${API_URL}/api/admin/skills/${id}`;

                    method =
                        "PUT";

                }


                const response =
                    await fetch(
                        url,
                        {
                            method:

                                method,

                            headers: {

                                "Authorization":
                                    `Bearer ${token}`,

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify(
                                    body
                                )

                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Operation failed"
                    );

                }


                closeModal();


                showMessage(
                    data.message,
                    true
                );


                loadSkills();


            } catch (error) {

                console.error(error);


                showMessage(
                    error.message,
                    false
                );

            }

        }
    );


    async function deleteSkill(id) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this skill?"
            );


        if (!confirmed) {

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_URL}/api/admin/skills/${id}`,
                    {
                        method: "DELETE",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Failed to delete skill"
                );

            }


            showMessage(
                data.message,
                true
            );


            loadSkills();


        } catch (error) {

            console.error(error);


            showMessage(
                error.message,
                false
            );

        }

    }


    function escapeHtml(value) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            value;


        return div.innerHTML;

    }


    function formatDate(date) {

        if (!date) {

            return "-";

        }


        return new Date(date)
            .toLocaleDateString();

    }


    loadSkills();

</script>

</body>

</html>
